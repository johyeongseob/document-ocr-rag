<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document OCR-RAG</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">PP-OCRv5 · GPT-5 mini</p>
        <h1>Document <span>OCR-RAG</span></h1>
        <p class="intro">
          문서에서 추출한 OCR 텍스트를 검색하고, 관련 근거만 사용해
          답변과 출처를 제공합니다.
        </p>
      </header>

      <section class="query-card" aria-labelledby="query-title">
        <div class="section-heading">
          <div>
            <h2 id="query-title">문서에 질문하기</h2>
          </div>
          <label class="top-k-control">
            검색 청크
            <select id="top-k">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
        </div>

        <label class="sr-only" for="question">질문</label>
        <textarea id="question" rows="1" placeholder="예: 개인신용정보 조회에 동의하지 않으면 어떤 불이익이 있나요?"></textarea>

        <div class="examples" aria-label="예시 질문">
          <button class="example" type="button">개인신용정보 조회에 동의하지 않으면 어떤 불이익이 있나요?</button>
          <button class="example" type="button">개인신용정보를 수집하고 이용하는 목적은 무엇인가요?</button>
          <button class="example" type="button">개인신용정보를 조회하는 대상 기관은 어디인가요?</button>
        </div>

        <button id="ask-button" class="primary-button" type="button">
          <span>근거 기반 답변 생성</span><span aria-hidden="true">→</span>
        </button>
        <p id="error" class="error" role="alert"></p>
      </section>

      <section id="result" class="result-grid" hidden>
        <article class="answer-card">
          <p class="step">01 · ANSWER</p>
          <h2>답변</h2>
          <div id="answer" class="answer"></div>
        </article>

        <aside class="evidence-card">
          <p class="step">02 · EVIDENCE</p>
          <h2>검색 근거</h2>
          <div id="contexts"></div>
        </aside>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
